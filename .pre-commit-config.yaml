# Baseline pre-commit config for a Python repo. Scoped down from a larger
# project's config (security scanners, framework-specific hooks) to the hygiene + formatting layer every Python repo wants
# regardless of size — see docs/github-standard.md § CI/pre-commit baseline
# for what's deliberately left out and why.
#
# Adopt: cp this file to .pre-commit-config.yaml at the repo root, adjust
# `language_version`/pyupgrade's `--pyXY-plus` to match your actual Python
# version, then `pre-commit install`.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
      - id: debug-statements
        language_version: python3.13

  - repo: https://github.com/asottile/pyupgrade
    rev: v3.22.0
    hooks:
      - id: pyupgrade
        args: [--py313-plus]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-format
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]

  # Module boundaries (tach.toml, gamekit#56). A local hook, not `tach install`,
  # which would overwrite pre-commit's own git hook. Runs at the default
  # commit stage: tach takes well under a second, and a pre-push stage would
  # never fire without default_install_hook_types.
  - repo: local
    hooks:
      - id: tach-check
        name: tach check (module boundaries)
        entry: uv run tach check
        language: system
        types_or: [python, toml]
        pass_filenames: false

  # mypy runs from the locked environment, not a pre-commit-managed one: a
  # mirrors-mypy hook pip-installs its additional_dependencies with no lockfile,
  # so gymnasium/numpy (and mypy itself) floated to the latest releases and
  # type-checked differently from CI (gamekit#63). `--locked` fails on a stale
  # uv.lock instead of silently using it; `--extra rl` installs gymnasium/numpy
  # so their real types are checked, not waved through by the
  # ignore_missing_imports override in pyproject.toml (gamekit#7). `files`
  # includes uv.lock so a lock-only bump re-runs the hook.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (locked environment)
        entry: uv run --locked --extra rl mypy src tests
        language: system
        files: ^(src/|tests/|pyproject\.toml$|uv\.lock$)
        pass_filenames: false
        require_serial: true
